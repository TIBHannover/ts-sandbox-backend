version: '3'

services:
    mongodb:
      image: mongo:3.6.23
      container_name: "mongodb"
      ports:
        - "27017:27017"
    ts-tiva-statistics-back:
      image: ts-tiva-statistics-back:1.0
      container_name: ts-tiva-statistics-back
      build:
        context: tiva-statistics
      ports:
        - "9393:9393"
      links:
        - mongodb
        -
    ts-statistics-back:
      image: ts-statistics-back:1.0
      container_name: ts-statistics-back
      build:
        context: statistics
      ports:
        - "9191:9191"
      links:
        - mongodb
    history-back:
      image: history-back:1.0
      container_name: history-back
      build:
        context: history
      ports:
        - "9090:9090"
      links:
        - mongodb

