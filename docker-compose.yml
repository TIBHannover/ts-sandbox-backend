version: '3'

services:
    mongodb:
      image: mongo:3.4.24
      container_name: "mongodb"
      ports:
        - "27017:27017"
    ts-statistics-back:
      image: ts-statistics-back:1.0
      container_name: ts-statistics-back
      build:
        context: .
      ports:
        - "9191:9191"
      links:
        - mongodb


