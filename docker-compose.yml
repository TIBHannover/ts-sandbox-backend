version: '3'

services:
  mongodb:
    #image: mongo:3.6.23
    image: mongo:latest
    container_name: "mongodb"
    ports:
      - "27017:27017"
    networks:
      - my_shared_network
    volumes:
      - ${HOME_PATH_LINUX}:/data/db
  ts-statistics-back:
    image: ts-statistics-back:1.0
    container_name: ts-statistics-back
    build:
      context: statistics
    ports:
      - "9191:9191"
    networks:
      - my_shared_network
    links:
      - mongodb
  history-back:
    image: history-back:1.0
    container_name: history-back
    build:
      context: history
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - GIT_AACHEN_TOKEN=${GIT_AACHEN_TOKEN}
      - GIT_TIB_EU_TOKEN=${GIT_TIB_EU_TOKEN}
      - GIT_ETSI_TOKEN=${GIT_ETSI_TOKEN}
      - ROBOT_CATALOG_PATH=${ROBOT_CATALOG_PATH:-}
      - ONDET_BATCH_CONTO_ENABLED=${ONDET_BATCH_CONTO_ENABLED:-false}
      - ONDET_BATCH_CONTO_MAX_DIFF_PAIRS=${ONDET_BATCH_CONTO_MAX_DIFF_PAIRS:-5}
      - ONDET_BATCH_CONTO_MAX_PAIR_RAW_BYTES=${ONDET_BATCH_CONTO_MAX_PAIR_RAW_BYTES:-5000000}
    ports:
      - "9090:9090"
    networks:
      - my_shared_network
    links:
      - mongodb
      - fuseki
    volumes:
      - ./history/robot-catalog:/app/robot-catalog:ro
  fuseki:
    image: secoresearch/fuseki
    container_name: fuseki
    ports:
      - "3030:3030"
    networks:
      - my_shared_network
      #- sdiff-inet
    environment:
      ADMIN_PASSWORD: fuseki
      QUERY_TIMEOUT: 600000
    volumes:
      - /data/terminology/fuseki/fuseki-data:/fuseki-base/databases
      - /data/terminology/fuseki/fuseki-configuration:/fuseki-base/configuration
  tiva-statistics-back:
    image: tiva-statistics-back:1.0
    container_name: tiva-statistics-back
    build:
      context: tiva
    ports:
      - "9494:9494"
    networks:
      - my_shared_network
    links:
      - mongodb
networks:
  #sdiff-inet:
   # driver: bridge
  my_shared_network:
    name: my_shared_network
    driver: bridge