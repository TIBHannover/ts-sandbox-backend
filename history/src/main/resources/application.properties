server.port=9090

spring.servlet.multipart.max-file-size=2MB

springdoc.packagesToScan=eu.tib.ontologyhistory.controller
springdoc.api-docs.path=/api-docs
springdoc.pathsToMatch=/api/**
server.forward-headers-strategy=framework

#for local testing
#spring.data.mongodb.uri=mongodb://localhost:27017/local
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.com.mongodb=DEBUG
logging.level.eu.tib.ontologyhistory=INFO

ondet.batch.conto.enabled=false
ondet.batch.conto.max-diff-pairs=5
ondet.batch.conto.max-pair-raw-bytes=5000000

# Optional ROBOT XML catalog used to resolve owl:imports to local files.
# Example: /app/robot-catalog/catalog-v001.xml
ondet.robot.catalog.path=${ROBOT_CATALOG_PATH:}
