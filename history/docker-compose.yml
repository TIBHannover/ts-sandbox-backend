services:
  mongodb:
    image: mongo:latest
    container_name: "mongodb"
    networks:
      - my_shared_network
    ports:
      - "27017:27017"
    volumes:
      - mongodb_volume:/data/db
  fuseki:
    image: secoresearch/fuseki
    container_name: fuseki
    networks:
      - my_shared_network
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: fuseki
      QUERY_TIMEOUT: 600000
    volumes:
      - fuseki_data_volume:/fuseki-base/databases
      - fuseki_configuration_volume:/fuseki-base/configuration
  history-back:
    image: history-back:1.0
    container_name: history-back
    networks:
      - my_shared_network
    build:
      context: .
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - GIT_AACHEN_TOKEN=${GIT_AACHEN_TOKEN}
      - GIT_TIB_EU_TOKEN=${GIT_TIB_EU_TOKEN}
      - GIT_ETSI_TOKEN=${GIT_ETSI_TOKEN}
      - ROBOT_CATALOG_PATH=${ROBOT_CATALOG_PATH:-}
    ports:
      - "9090:9090"
volumes:
  mongodb_volume:
    driver: local
  fuseki_data_volume:
    driver: local
  fuseki_configuration_volume:
    driver: local
networks:
  my_shared_network:
    name: my_shared_network
    driver: bridge
