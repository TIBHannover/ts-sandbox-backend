
# This file is a template, and might need editing before it works on your project.
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages

image: maven:3.6.3-jdk-11

variables:
  IMAGE_NAME: $CI_PROJECT_PATH/$CI_COMMIT_REF_NAME

stages:          # List of stages for jobs, and their order of execution
  - test
  - build
  - sonarqube
  - deploy
  - remove_docker
#  - dockerize

.deploy_job:
  image: mullnerz/ansible-playbook:2.9.1
  stage: deploy
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - git clone https://github.com/aamir9138/TIB-Terminology-Service-Statistics-box.git
  script:
    - ansible-playbook -v -i ${INVENTORY_FILE} TIB-Terminology-Service-Statistics-box/ansible/playbook.yml

test:
  stage: test
  script:
    - mvn clean test -B

build:
  stage: build
  only:
    - main
    - branches
  script:
    - mvn clean package -B

sonarqube-check:
  stage: sonarqube
  image: maven:3.6.3-jdk-11
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script: 
    - mvn verify sonar:sonar -Dsonar.projectKey=terminology_sandbox_tib-terminology-service-statistics_AX4zSJvPXTVyuzMM6ZO3
  allow_failure: true
  only:
    - main
    - branches
deploy to TEST:
  variables:
    INVENTORY_FILE: inventory/sandbox_test.yml
  extends: .deploy_job
  when: manual

.remove_docker_job:
  image: mullnerz/ansible-playbook:2.9.1
  stage: remove_docker
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ansible-playbook -v -i ${INVENTORY_FILE} remove_all_docker.yml -e 'ansible_python_interpreter=/usr/bin/python3'

remove_docker to TEST:
  variables:
    INVENTORY_FILE: inventory/sandbox_test.yml
  extends: .remove_docker_job
  when: manual



