image: maven:3.9.4-eclipse-temurin-17

variables:
  IMAGE_NAME: $CI_PROJECT_PATH/$CI_COMMIT_REF_NAME

stages:          # List of stages for jobs, and their order of execution
  - test
  - build
  - sonarqube
#  - dockerize

test:
  stage: test
  script:
    - mvn clean test -B
  when: manual

build:
  stage: build
  only:
    - main
    - branches
  script:
    - mvn clean package -B
  when: manual

sonarqube-check:
  stage: sonarqube
  image: maven:3.9.4-eclipse-temurin-17
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - mvn verify sonar:sonar -Dsonar.projectKey=terminology_sandbox_tib-terminology-service-statistics_AX4zSJvPXTVyuzMM6ZO3
  allow_failure: true
  only:
    - main
    - branches
  when: manual


