spring:
  data:
    mongodb:
      database: ontology_statistics_db
      host: mongodb
      port: 27017
  main:
    lazy-initialization: true

server:
  port: 9191

  main:
    allow-bean-definition-overriding : true

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

preprocessing:
  run: true

ts:
  ontologies.list.size: 20
  base.uri: https://service.tib.eu/ts4tib/api/ontologies
  timeout:
    connect: 10000
    read: 10000

similarity:
  weight:
    property: 0.2
    class: 0.2
    namespace: 0.2
    import: 0.2
    individual: 0.2

#list ontology ids in lower case
skip.ontologies.processing: hp,gaxcore,tema,fibo,chiro,chebi,efo,bau,raum,hoom,ms,ncit,ordo40,ordo42,snomedct,envo,pato,bto,obi,mop,edam,chmo,afo,sto,enm,sepio,infosecsos,
