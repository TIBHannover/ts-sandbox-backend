spring:
  data:
    mongodb:
      database: ontology_statistics_db
      host: mongodb
      port: 27017
  main:
    lazy-initialization: true

server:
  port: 9191

  main:
    allow-bean-definition-overriding: true
    web-application-type: none

logging:
  level:
    org.springframework.web: TRACE
    eu.tib.ts: DEBUG


preprocessing:
  run: true


ts:
  ontologies.list.size: 5
  base.uri: https://api.terminology.tib.eu/api/v2/ontologies
  classifications:
    - NFDI4ING
    - NFDI4Energy
    - CoyPu
  timeout:
    connect: 4000
    read: 4000

#list ontology ids in lower case
#skip.ontologies.processing: hp,gaxcore,tema,fibo,chiro,chebi,efo,bau,raum,hoom,ms,ncit,ordo40,ordo42,snomedct,envo,pato,bto,obi,mop,edam,chmo,afo,sto

