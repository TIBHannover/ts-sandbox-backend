version: '3'

services:
  mongodb:
    image: mongo:latest
    container_name: "mongodb"
    ports:
      - "27017:27017"
    volumes:
      - ${HOME_PATH_LINUX}:/data/db
    networks:
      - my_shared_network
  quality-assessment-back:
    image: quality-assessment-back:1.0
    container_name: quality-assessment-back
    build:
      context: .
    ports:
      - "9696:9696"
    networks:
      - my_shared_network
    links:
      - mongodb
networks:
  my_shared_network:
    name: my_shared_network
    driver: bridge