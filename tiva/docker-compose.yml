version: '3'

services:
  mongodb:
    #image: mongo:3.6.23
    image: mongo:latest
    container_name: "mongodb"
    ports:
      - "27017:27017"
    volumes:
      - ${HOME_PATH_LINUX}:/data/db
    networks:
      - my_shared_network
  ts-statistics-back:
    image: tiva-statistics-back:1.0
    container_name: tiva-statistics-back
    build:
      context: .
    ports:
      - "9494:9494"
    links:
      - mongodb
networks:
  my_shared_network:
    name: my_shared_network
    driver: bridge