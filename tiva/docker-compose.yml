version: '3'

services:
  mongodb:
    image: mongo:3.6.23
    container_name: "mongodb"
    ports:
      - "27017:27017"
  ts-statistics-back:
    image: tiva-statistics-back:1.0
    container_name: tiva-statistics-back
    build:
      context: .
    ports:
      - "9393:9393"
    links:
      - mongodb